[project]
name = "kazuist-worker"
version = "0.0.0"
description = "Kazuist Python worker: ingestion, anonymisation, NLP, citation extraction, DOCX validation."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pypdf>=6.21.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy, local only NER backends (anonymizer/ner.py). CI does not install these.
ner = [
  "onnxruntime>=1.20",
  "onnx>=1.17",
  "transformers>=5.10,<5.17",
  "gliner>=0.2.29,<0.3",
]
# Run time NER only (ADR-0026, istek anonimlestirme-ner-calisma-zamani): the ONNX graphs exported by
# eval/anon/export_ner.py run with these three; no torch, transformers or gliner. Licenses: onnxruntime MIT,
# tokenizers Apache-2.0, numpy BSD-3-Clause. The worker-py image installs this extra; CI does not.
ner-runtime = [
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "numpy>=1.26",
]
presidio = [
  "presidio-analyzer>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "anonymizer/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
