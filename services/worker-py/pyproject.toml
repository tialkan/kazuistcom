[project]
name = "kazuist-worker"
version = "0.0.0"
description = "Kazuist Python worker: ingestion, anonymisation, NLP, citation extraction, DOCX validation."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy, local only NER backends (anonymizer/ner.py). CI does not install these.
ner = [
  "onnxruntime>=1.20",
  "optimum[onnxruntime]>=1.23",
  "transformers>=4.46",
  "gliner>=0.2.13",
]
presidio = [
  "presidio-analyzer>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "anonymizer/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
