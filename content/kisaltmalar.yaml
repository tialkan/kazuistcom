# Kısaltmalar sözlüğü (plan 10.5/7, FR-91). Kısaltmalar cetveli üreticisi yüklenen metindeki adayları bu sözlükle eşler.
# Durum: çalışma taslağı. Yazma ajanı yazdı; içerik ve editör incelemesi bekliyor (docs/istekler/yazma-icerik-dosyalari.md).
# Her giriş yaygın hukuk yazımındaki açılımı verir; bir kurumun kılavuzu farklı yazım istiyorsa kullanıcı cetvelde düzeltir.
# baglam: sayi ise kısaltma yalnız ardından rakam geldiğinde aday sayılır (E. 2013/19, s. 45), böylece cümle sonundaki
# nokta kısaltma sanılmaz.
