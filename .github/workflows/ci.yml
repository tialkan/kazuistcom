name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older PR run; on main every run finishes, so the published "main" tag never stops
  # halfway between images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Text rules (U+2014 and banned phrases)
        run: pnpm check:text
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Contracts lint (Redocly)
        run: pnpm --filter @kazuist/contracts lint
      - name: Generated client is up to date
        run: pnpm --filter @kazuist/contracts check:generated
      - name: i18n key structure
        run: pnpm --filter @kazuist/i18n check
      - name: Tests (includes PGlite migration test)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Prompt injection set (tests/security/enjeksiyon)
        run: pnpm exec vitest run --config tests/security/enjeksiyon/vitest.config.ts

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker-py
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks git --redact --verbose .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Dependency audit and license scan (tests/security/tarama)
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir tests/e2e install --ignore-workspace --frozen-lockfile
          pnpm --dir tests/security install --ignore-workspace --frozen-lockfile
          python3 -m unittest discover -s tests/security/tarama -p 'test_*.py'
          (cd services/worker-py && uv sync --frozen)
          sh tests/security/tarama/tarama.sh "$RUNNER_TEMP/tarama"
      - name: Scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarama
          path: ${{ runner.temp }}/tarama
          if-no-files-found: ignore
          retention-days: 14

  docker:
    # Real PostgreSQL 18 + pgvector, Valkey, S3 and Mailpit from infra/docker-compose.dev.yml on the runner;
    # migrations through the one-shot migrate image, DB smoke test, the app images (linux/amd64, built here and
    # never pushed; the "publish" job pushes the same builds from the layer cache after every job is green), the
    # production compose file with these images, and the off-server backup with a restore test.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: infra/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v5
      - name: Throwaway credentials for CI services
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "S3_ACCESS_KEY_ID=ci$(openssl rand -hex 6)"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 20)"
          } > .env
      - name: Validate compose file
        run: docker compose --env-file .env config --quiet
      - name: docker compose up --wait
        run: docker compose --env-file .env up -d --wait --wait-timeout 180
      - name: Service status
        if: always()
        run: docker compose --env-file .env ps
      - name: S3 endpoint answers
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            if [ "$code" != "000" ]; then echo "S3 HTTP $code"; exit 0; fi
            sleep 2
          done
          docker compose --env-file .env logs s3 | tail -50
          exit 1
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata (commit, commit time, version)
        id: meta
        run: |
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          # Commit time, not wall clock: the same commit builds byte-identical layers, so "publish" hits the cache.
          echo "built_at=$(git log -1 --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./apps/web/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/worker-node/Dockerfile
          target: migrate
          platforms: linux/amd64
          load: true
          tags: kazuist-migrate:ci
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
      - name: Migrate (one-shot image, real PostgreSQL)
        run: |
          set -a; . ./.env; set +a
          docker run --rm --network host \
            -e DATABASE_URL="postgres://kazuist:${POSTGRES_PASSWORD}@127.0.0.1:5432/kazuist" \
            kazuist-migrate:ci
      - name: Migrate again (must be a no-op)
        run: |
          set -a; . ./.env; set +a
          docker run --rm --network host \
            -e DATABASE_URL="postgres://kazuist:${POSTGRES_PASSWORD}@127.0.0.1:5432/kazuist" \
            kazuist-migrate:ci | tee migrate2.log
          grep -q '"msg":"done"' migrate2.log
      - name: DB smoke test (vector, pg_trgm, turkish tsvector, ledger triggers)
        run: >
          docker compose --env-file .env exec -T postgres
          psql -U kazuist -d kazuist -v ON_ERROR_STOP=1 -f - < infra/scripts/db-smoke.sql
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: kazuist-web:ci
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build worker-node image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/worker-node/Dockerfile
          platforms: linux/amd64
          load: true
          tags: kazuist-worker-node:ci
          build-args: GIT_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha,scope=worker-node
          cache-to: type=gha,mode=max,scope=worker-node
      - name: Build worker-py image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/worker-py/Dockerfile
          platforms: linux/amd64
          load: true
          tags: kazuist-worker-py:ci
          build-args: GIT_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha,scope=worker-py
          cache-to: type=gha,mode=max,scope=worker-py
      - name: Build maintenance image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/maintenance/Dockerfile
          platforms: linux/amd64
          load: true
          tags: kazuist-maintenance:ci
          cache-from: type=gha,scope=maintenance
          cache-to: type=gha,mode=max,scope=maintenance
      - name: Build context excludes screenshot evidence and server-side files
        run: |
          # .dockerignore must keep apps/web/**/_kanit (about 29 MB of PNG) and infra/backup out of every image.
          for img in kazuist-web:ci kazuist-worker-node:ci kazuist-worker-py:ci; do
            if docker run --rm --entrypoint sh "$img" -c 'find / -xdev \( -name _kanit -o -path "*/infra/backup" \) 2>/dev/null | grep -q .'; then
              echo "$img contains _kanit or infra/backup"; exit 1
            fi
          done
      - name: Maintenance page image returns 503 with the page
        run: |
          docker run -d --name maint -p 127.0.0.1:8080:8080 kazuist-maintenance:ci
          sleep 2
          code=$(curl -s -o page.html -w '%{http_code}' http://127.0.0.1:8080/herhangi)
          test "$code" = "503"
          grep -q 'bakımda' page.html
          docker rm -f maint
      - name: Images run as non-root
        run: |
          for img in kazuist-web:ci kazuist-worker-node:ci kazuist-worker-py:ci kazuist-migrate:ci kazuist-maintenance:ci; do
            u=$(docker image inspect -f '{{.Config.User}}' "$img")
            echo "$img user=$u"
            if [ -z "$u" ] || [ "$u" = "root" ] || [ "$u" = "0" ]; then exit 1; fi
          done
      - name: worker-py imports its entry point and the source registry
        run: >
          docker run --rm kazuist-worker-py:ci python -c
          "import os, core.main, psycopg; from core.sources import SourceRegistry as R;
          r = R.load(); n = r.names(); on = [x for x in n if r.switch_on(x)];
          assert os.environ['KAZUIST_SOURCES_DIR'] == '/srv/docs/kaynaklar';
          assert len(n) > 0, 'registry empty'; assert not on, on;
          print('sources', len(n), 'all off by default')"
      - name: worker-py image carries no optional ner extra (transformers, O-07)
        run: >
          docker run --rm kazuist-worker-py:ci python -c
          "import importlib.util as u; assert u.find_spec('transformers') is None; print('no transformers')"
      - name: worker-py image has the ner-runtime extra and fails closed without an NER model
        run: >
          docker run --rm kazuist-worker-py:ci python -c
          "import os, onnxruntime, tokenizers, numpy;
          from anonymizer.pipeline import anonymize;
          assert os.environ['KAZUIST_ENV'] == 'production' and os.environ['KAZUIST_NER_DIR'] == '/models/ner';
          r = anonymize('Davacı Deneme Kişisi dava açmıştır.');
          assert r.blocked == 'ner_unavailable' and not r.publishable, r.blocked;
          print('onnxruntime', onnxruntime.__version__, 'fail closed ok')"
      - name: Runtime environment for app containers
        run: |
          set -a; . ./.env; set +a
          {
            echo "DATABASE_URL=postgres://kazuist:${POSTGRES_PASSWORD}@127.0.0.1:5432/kazuist"
            echo "VALKEY_URL=redis://127.0.0.1:6379"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "BYOK_SIGNING_SECRET=$(openssl rand -hex 32)"
            # No S3_ENDPOINT or S3_BUCKET: /api/health must be 200 without them while no code uses S3.
            # No reverse proxy in front of the container in CI: the client IP is x-real-ip.
            echo "TRUSTED_PROXY_COUNT=0"
            # Random placeholders against the iyzico sandbox so billing routes are configured; no real key.
            echo "IYZICO_BASE_URL=https://sandbox-api.iyzipay.com"
            echo "IYZICO_API_KEY=ci-$(openssl rand -hex 12)"
            echo "IYZICO_SECRET_KEY=ci-$(openssl rand -hex 12)"
            echo "IYZICO_MERCHANT_ID=ci"
            # Mailpit from infra/docker-compose.dev.yml; MAIL_SMTP_URL is critical for /api/health (plan 14.6).
            echo "MAIL_SMTP_URL=smtp://127.0.0.1:1025"
          } > app.env
      - name: web /api/version commit and /api/health 200 with dependencies up
        run: |
          docker run -d --name web --network host --env-file app.env kazuist-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/version > version.json; then break; fi
            sleep 2
          done
          cat version.json; echo
          grep -q '${{ github.sha }}' version.json
          code=$(curl -s -o health.json -w '%{http_code}' http://127.0.0.1:3000/api/health)
          echo "health HTTP $code $(cat health.json)"
          test "$code" = "200"
          # Mailpit answers the SMTP probe, so the body is ok, not degraded.
          grep -q '"status":"ok"' health.json
      - name: /api/health 503 without MAIL_SMTP_URL, 200 degraded when the SMTP server is unreachable
        run: |
          probe() {
            docker run -d --name "$1" --network host --env-file app.env -e PORT="$2" "${@:3}" kazuist-web:ci > /dev/null
            for i in $(seq 1 30); do
              code=$(curl -s -o "$1.json" -w '%{http_code}' --max-time 10 "http://127.0.0.1:$2/api/health" || true)
              [ "$code" != "000" ] && break
              sleep 2
            done
            echo "$1: health HTTP $code $(cat "$1.json")"
            docker rm -f "$1" > /dev/null
          }
          probe web-nomail 3101 -e MAIL_SMTP_URL=
          test "$code" = "503"
          # The variable name never leaves the server.
          if grep -q MAIL web-nomail.json; then exit 1; fi
          probe web-smtpdown 3102 -e MAIL_SMTP_URL=smtp://127.0.0.1:1
          test "$code" = "200"
          grep -q '"status":"degraded"' web-smtpdown.json
      - name: /api/health 503 when Valkey stops, 200 again when it returns
        run: |
          docker compose --env-file .env stop valkey
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3000/api/health)
          echo "valkey down: health HTTP $code"
          test "$code" = "503"
          docker compose --env-file .env start valkey
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3000/api/health)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "valkey back: health HTTP $code"
          test "$code" = "200"
      - name: Workers start from their real entry points and claim jobs
        run: |
          q() { docker compose --env-file .env exec -T postgres psql -U kazuist -d kazuist -tA -v ON_ERROR_STOP=1 -c "$1"; }
          node_job=$(q "INSERT INTO jobs (type, payload, max_attempts) VALUES ('billing.reconcile', '{\"day\":\"2026-01-01\"}', 1) RETURNING id" | head -1)
          py_job=$(q "INSERT INTO jobs (type, payload, max_attempts) VALUES ('anon.run', '{}', 1) RETURNING id" | head -1)
          docker run -d --name worker-node --network host --env-file app.env kazuist-worker-node:ci
          docker run -d --name worker-py --network host --env-file app.env kazuist-worker-py:ci
          ok=""
          for i in $(seq 1 30); do
            n=$(q "SELECT count(*) FROM jobs WHERE id IN ('$node_job','$py_job') AND (attempts >= 1 OR status <> 'queued')" | head -1)
            if [ "$n" = "2" ]; then ok=1; break; fi
            sleep 2
          done
          q "SELECT type, status, attempts FROM jobs WHERE id IN ('$node_job','$py_job')"
          docker logs worker-node 2>&1 | tail -5
          docker logs worker-py 2>&1 | tail -5
          test -n "$ok"
          test "$(docker inspect -f '{{.State.Running}}' worker-node)" = "true"
          test "$(docker inspect -f '{{.State.Running}}' worker-py)" = "true"
          docker exec worker-py python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/healthz').read().decode())"
      - name: Workers stop cleanly on SIGTERM
        run: |
          docker stop -t 20 worker-node worker-py
          for c in worker-node worker-py; do
            code=$(docker inspect -f '{{.State.ExitCode}}' $c)
            echo "$c exit $code"
            test "$code" = "0"
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: web health-deps test against the real services (installs web and worker-node)
        run: |
          pnpm install --frozen-lockfile --filter "@kazuist/web..." --filter "@kazuist/worker-node..."
          set -a; . ./app.env; set +a
          KAZUIST_IT_DATABASE_URL="$DATABASE_URL" KAZUIST_IT_VALKEY_URL="$VALKEY_URL" KAZUIST_IT_SMTP_URL="$MAIL_SMTP_URL" \
            pnpm --filter @kazuist/web exec vitest run test/health-deps.test.ts
      - name: worker-node account purge against the real PostgreSQL
        run: |
          set -a; . ./app.env; set +a
          KAZUIST_IT_DATABASE_URL="$DATABASE_URL" pnpm --filter @kazuist/worker-node exec vitest run src/account
      - name: web edu_claims (one account per edu.tr mailbox, two connection race) against the real PostgreSQL
        run: |
          set -a; . ./app.env; set +a
          KAZUIST_IT_DATABASE_URL="$DATABASE_URL" \
            pnpm --filter @kazuist/web exec vitest run src/server/auth/__tests__/edu-claims.test.ts
      - name: worker-node LISTEN reconnects after its connection is killed (real PostgreSQL)
        run: |
          set -a; . ./app.env; set +a
          KAZUIST_IT_DATABASE_URL="$DATABASE_URL" pnpm --filter @kazuist/worker-node exec vitest run test/listen.test.ts
      - name: Install Playwright suites (tests/e2e, tests/security)
        run: |
          pnpm --dir tests/e2e install --ignore-workspace --frozen-lockfile
          pnpm --dir tests/security install --ignore-workspace --frozen-lockfile
          pnpm --dir tests/e2e exec playwright install --with-deps chromium
      - name: Security HTTP tests against the production image (tests/security)
        run: |
          set -a; . ./app.env; set +a
          KAZUIST_SEC_BASE_URL=http://localhost:3000 KAZUIST_SEC_DATABASE_URL="$DATABASE_URL" \
            pnpm --dir tests/security exec playwright test
      - name: E2E smoke against the production image (tests/e2e)
        if: success() || failure()
        run: KAZUIST_E2E_BASE_URL=http://localhost:3000 pnpm --dir tests/e2e exec playwright test
      - name: Lighthouse CI budgets (mobile; performance 90, accessibility 95, SEO 90; core pages)
        if: success() || failure()
        env:
          LHCI_VERSION: 0.15.1
        # is-crawlable is skipped (infra/lighthouse/lighthouserc.json): this server is not production, so every page
        # carries noindex on purpose ((seo)/_seo/ortam.ts) and the audit would fail by design; the SEO tests cover
        # the production directive. The remaining SEO audits count towards the 0.9 floor.
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          npx --yes "@lhci/cli@${LHCI_VERSION}" autorun --config=infra/lighthouse/lighthouserc.json
      - name: Production compose (infra/docker-compose.prod.yml) starts healthy with the CI images
        env:
          P: docker compose -p kazuist-prod -f prod-compose.yml --env-file prod.env
        run: |
          sudo install -d -o 10001 -g 10001 /srv/kazuist/raw-store
          sudo install -d -o root -g root -m 755 /srv/kazuist/models/ner /srv/kazuist/models/embed
          {
            echo "KAZUIST_IMAGE_PREFIX=kazuist"
            echo "KAZUIST_IMAGE_TAG=ci"
            echo "KAZUIST_PULL_POLICY=never"
            echo "KAZUIST_ENV=staging"
            echo "APP_URL=http://localhost:3000"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "VALKEY_PASSWORD=$(openssl rand -hex 24)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BYOK_SIGNING_SECRET=$(openssl rand -hex 32)"
            echo "PII_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "KAZUIST_INTERNAL_TOKEN=$(openssl rand -hex 32)"
            # Required by the file; no SMTP server on the stack network in CI, so the body reads degraded.
            echo "MAIL_SMTP_URL=smtp://mail.invalid:25"
          } > prod.env
          # exclude_from_hc is a Coolify key that docker compose does not know.
          sed '/exclude_from_hc/d' infra/docker-compose.prod.yml > prod-compose.yml
          $P config --quiet
          # Every KAZUIST_* variable the services read is passed, and the source switches match docs/kaynaklar.
          $P config --format json > prod-compose.json
          python3 infra/scripts/compose-env-check.py prod-compose.json
          rm prod-compose.json
          # Required variables are enforced: without POSTGRES_PASSWORD the file must not render.
          grep -v '^POSTGRES_PASSWORD=' prod.env > prod-missing.env
          if docker compose -p x -f prod-compose.yml --env-file prod-missing.env config --quiet 2>/dev/null; then
            echo "missing required variable was accepted"; exit 1
          fi
          $P up -d
          ok=""
          for i in $(seq 1 60); do
            states=""
            healthy=0
            for svc in postgres valkey web worker-node worker-py maintenance; do
              c=$($P ps -q "$svc")
              st=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$c" 2>/dev/null || echo none)
              states="$states $svc=$st"
              if [ "$st" = "healthy" ]; then healthy=$((healthy + 1)); fi
            done
            echo "$states"
            if [ "$healthy" = "6" ]; then ok=1; break; fi
            sleep 5
          done
          $P ps -a
          test -n "$ok"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$($P ps -aq migrate)")" = "0"
      - name: Production compose limits, ports, volumes and version
        env:
          P: docker compose -p kazuist-prod -f prod-compose.yml --env-file prod.env
        run: |
          check_mem() {
            got=$(docker inspect -f '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}' "$($P ps -q "$1")")
            echo "$1 memory/swap $got"
            test "$got" = "$2 $2"
          }
          check_mem postgres $((6 * 1024 * 1024 * 1024))
          check_mem worker-py $((3 * 1024 * 1024 * 1024))
          check_mem web $((1024 * 1024 * 1024))
          check_mem worker-node $((512 * 1024 * 1024))
          check_mem valkey $((384 * 1024 * 1024))
          # Valkey holds nonces and money counters: no eviction, append only file on its volume, survives a restart.
          V() { $P exec -T valkey sh -c 'valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning "$@"' -- "$@"; }
          test "$(V config get maxmemory-policy | tail -1)" = "noeviction"
          test "$(V config get appendonly | tail -1)" = "yes"
          docker volume inspect kazuist-prod_valkeydata > /dev/null
          # Nothing is published on the host; Traefik reaches web over the stack network.
          for svc in postgres valkey web worker-node worker-py maintenance; do
            ports=$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$($P ps -q "$svc")")
            echo "$svc port bindings $ports"
            if echo "$ports" | grep -q HostPort; then exit 1; fi
          done
          # App containers run as non-root with every capability dropped.
          for svc in web worker-node worker-py maintenance; do
            c=$($P ps -q "$svc")
            uid=$(docker exec "$c" id -u)
            echo "$svc uid=$uid capdrop=$(docker inspect -f '{{.HostConfig.CapDrop}}' "$c")"
            test "$uid" != "0"
          done
          # Raw store is the host folder and writable by worker-py; model folders are read only.
          $P exec -T worker-py python -c "import os; os.makedirs('/data/raw-store/ci', exist_ok=True); open('/data/raw-store/ci/kanit.txt', 'w').write('ci raw store')"
          sudo test -f /srv/kazuist/raw-store/ci/kanit.txt
          if $P exec -T worker-py python -c "open('/models/ner/x', 'w')" 2>/dev/null; then
            echo "/models/ner is writable"; exit 1
          fi
          # web serves this commit; health is 200 through its own probes without any S3 variable (the body is
          # degraded: prod.env points MAIL_SMTP_URL at a host that does not exist).
          $P exec -T web node -e "fetch('http://127.0.0.1:3000/api/version').then(r=>r.text()).then(t=>{console.log(t);process.exit(t.includes(process.argv[1])?0:1)})" "$GITHUB_SHA"
          $P exec -T web node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{console.log('health', r.status);process.exit(r.status===200?0:1)})"
          # web reaches the worker-py internal API by service name (any HTTP answer proves the route).
          $P exec -T web node -e "fetch('http://worker-py:8001/').then(r=>console.log('worker-py internal HTTP', r.status),e=>{console.error(e.cause?.code||e.message);process.exit(1)})"
          # A key written before a Valkey restart is still there with its TTL (AOF on the valkeydata volume).
          V set ci:kalici 1 EX 600 > /dev/null
          $P restart valkey
          for i in $(seq 1 20); do V ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          test "$(V get ci:kalici)" = "1"
          test "$(V ttl ci:kalici)" -gt 0
          echo "valkey key survived the restart"
      - name: Off-server backup and restore test (infra/backup, local restic repository)
        env:
          P: docker compose -p kazuist-prod -f prod-compose.yml --env-file prod.env
        run: |
          marker="ci-$(openssl rand -hex 8)"
          $P exec -T postgres psql -U kazuist -d kazuist -v ON_ERROR_STOP=1 -q \
            -c "CREATE TABLE ci_restore_marker (v text); INSERT INTO ci_restore_marker VALUES ('$marker')"
          openssl rand -hex 32 > "$RUNNER_TEMP/restic-password"
          B=(sudo env RESTIC_REPOSITORY="$RUNNER_TEMP/restic-repo" RESTIC_PASSWORD_FILE="$RUNNER_TEMP/restic-password"
             KAZUIST_BACKUP_ENV=/nonexistent)
          "${B[@]}" infra/backup/backup.sh init
          "${B[@]}" infra/backup/backup.sh 2>&1 | tee backup.log
          grep -q '"msg":"done"' backup.log
          # No silent empty backup: a label without a running container must fail.
          if "${B[@]}" KAZUIST_PG_LABEL=kazuist.service=yok infra/backup/backup.sh 2>/dev/null; then
            echo "backup without a postgres container succeeded"; exit 1
          fi
          "${B[@]}" infra/backup/backup.sh snapshots
          "${B[@]}" KAZUIST_RESTORE_SMOKE_SQL="$PWD/infra/scripts/db-smoke.sql" \
            KAZUIST_RESTORE_CHECK_SQL="SELECT EXISTS (SELECT 1 FROM ci_restore_marker WHERE v = '$marker')" \
            infra/backup/restore-test.sh 2>&1 | tee restore.log
          grep -q '"msg":"done"' restore.log
          grep -q '"compared":[1-9]' restore.log
          # The check query is not vacuous: a value that was never written must fail the restore test.
          if "${B[@]}" KAZUIST_RESTORE_CHECK_SQL="SELECT EXISTS (SELECT 1 FROM ci_restore_marker WHERE v = 'yok')" \
            infra/backup/restore-test.sh 2>/dev/null; then
            echo "restore test passed a false check"; exit 1
          fi
          "${B[@]}" KAZUIST_DISK_LIMIT_PCT=100 infra/backup/disk-check.sh
          # Nothing restored is left behind.
          test -z "$(sudo find /var/tmp -maxdepth 1 -name 'kazuist-restore.*')"
          test -z "$(docker ps -aq --filter label=kazuist.service=restore-test)"
      - name: Playwright and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            tests/e2e/test-results
            tests/security/test-results
            lhci-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: |
          docker compose --env-file .env logs --tail 100
          for c in web worker-node worker-py; do docker logs $c 2>&1 | tail -40 || true; done
          if [ -f prod.env ]; then
            docker compose -p kazuist-prod -f prod-compose.yml --env-file prod.env ps -a || true
            docker compose -p kazuist-prod -f prod-compose.yml --env-file prod.env logs --tail 60 || true
          fi
      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env down -v
          if [ -f prod.env ]; then docker compose -p kazuist-prod -f prod-compose.yml --env-file prod.env down -v; fi

  publish:
    # Pushes the images to GHCR only for a push to main and only after node, python, gitleaks and docker are green.
    # Same Dockerfiles, build arguments and layer cache as the docker job, so the pushed image is the tested build.
    # Tags: the full commit sha (what production pins) and "main". Coolify pulls; the server never builds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [node, python, gitleaks, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            file: infra/docker/web/Dockerfile
            target: ''
          - name: worker-node
            file: infra/docker/worker-node/Dockerfile
            target: ''
          - name: migrate
            file: infra/docker/worker-node/Dockerfile
            target: migrate
          - name: worker-py
            file: infra/docker/worker-py/Dockerfile
            target: ''
          - name: maintenance
            file: infra/maintenance/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v5
      - name: Image metadata (registry path, commit, commit time, version)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kazuist-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git log -1 --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./apps/web/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.created=${{ steps.meta.outputs.built_at }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Pushed image runs as non-root and carries the commit
        run: |
          ref="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.commit }}"
          docker pull -q "$ref"
          u=$(docker image inspect -f '{{.Config.User}}' "$ref")
          rev=$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ref")
          echo "$ref user=$u revision=$rev"
          test -n "$u" && test "$u" != "root" && test "$u" != "0"
          test "$rev" = "$GITHUB_SHA"
