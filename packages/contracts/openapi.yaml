                properties:
                  items:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/RefundRequestReview' }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/refund-requests/{requestId}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      operationId: adminGetRefundRequest
      x-kazuist-requires: [passkey, second-factor]
      summary: Read original purchase evidence, decision and item outcomes
      description: No raw payment or legal document fields; private, no-store.
      responses:
        '200':
          description: Current refund request review with live candidate caps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundRequestReviewDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/refund-requests/{requestId}/decision:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      operationId: adminDecideRefundRequest
      x-kazuist-requires: [passkey, second-factor]
      summary: Decide a deletion refund request once
      description: |
        Server-derived actor, CSRF and user rate limit required. Bind Idempotency-Key to the actor,
        operation, target and strict request body. Conflicting replay is 409; identical replay returns
        the original response. Request/order locks prevent parallel decisions with different keys.
        Approved amounts use original discounted payments and remaining credits with consumer-favourable
        rounding up, capped by prior refund exposure. Open AI reservations are 409. Unknown provider
        outcomes remain pending and are never automatically resent. Rejection is not a money refund.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRefundRequestDecisionInput' }
      responses:
        '200':
          description: Rejected or all item refunds confirmed successful.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundRequestReview' }
        '202':
          description: Approved, at least one item remains ready, failed or unknown; not completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundRequestReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/admin/refund-requests/{requestId}/execute:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      operationId: adminExecuteRefundRequest
      x-kazuist-requires: [passkey, second-factor]
      summary: Explicitly resume ready or definitely failed approved items
      description: |
        Server-derived actor, CSRF and user rate limit required. Bind Idempotency-Key to the actor,
        operation, target and strict request body. Conflicting replay is 409; identical replay returns
        the original response. Request/order locks prevent parallel decisions with different keys.
        Approved amounts use original discounted payments and remaining credits with consumer-favourable
        rounding up, capped by prior refund exposure. Open AI reservations are 409. Unknown provider
        outcomes remain pending and are never automatically resent. Rejection is not a money refund.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRefundRequestExecuteInput' }
      responses:
        '200':
          description: Rejected or all item refunds confirmed successful.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundRequestReview' }
        '202':
          description: Approved, at least one item remains ready, failed or unknown; not completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundRequestReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/admin/refund-requests/{requestId}/items/{itemId}/resolve:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      operationId: adminResolveRefundRequestItem
      x-kazuist-requires: [passkey, second-factor]
      summary: Resolve one unknown outcome without sending money again
      description: |
        Server-derived actor, CSRF and user rate limit required. Bind Idempotency-Key to the actor,
        operation, target and strict request body. Conflicting replay is 409; identical replay returns
        the original response. Request/order locks prevent parallel decisions with different keys.
        Approved amounts use original discounted payments and remaining credits with consumer-favourable
        rounding up, capped by prior refund exposure. Open AI reservations are 409. Unknown provider
        outcomes remain pending and are never automatically resent. Rejection is not a money refund.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRefundRequestItemResolveInput' }
      responses:
        '200':
          description: Rejected or all item refunds confirmed successful.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundRequestReview' }
        '202':
          description: Approved, at least one item remains ready, failed or unknown; not completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundRequestReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/admin/refunds/pending:
    get:
      tags: [admin]
      operationId: adminListPendingRefunds
      x-kazuist-requires: [passkey, second-factor]
      summary: Refunds whose outcome is unknown (resolve within 3 work days)
      responses:
        '200':
          description: Pending refunds, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingRefund' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/refunds/{refundRef}/resolve:
    parameters:
      - name: refundRef
        in: path
        required: true
        description: payments.refund_ref, for example fesih:<subscription id>.
        schema: { type: string, pattern: '^[a-z_]{1,30}:[0-9a-f-]{36}$' }
    post:
      tags: [admin]
      operationId: adminResolveRefund
      x-kazuist-requires: [passkey, second-factor]
      summary: Close an unknown refund outcome after checking the iyzico panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { type: string, enum: [basarili, basarisiz] }
      responses:
        '204':
          description: Resolved; the decision is in the audit log.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/reports:
    get:
      tags: [admin]
      operationId: adminGetReports
      x-kazuist-requires: [passkey, second-factor]
      summary: Cost, abstention and reconciliation reports
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [maliyet, cekimserlik, mutabakat, kullanim] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Report rows.
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kazuist.session_token
      description: HttpOnly, Secure, SameSite=Lax session cookie set by Better Auth.
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer session token for the iOS app.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client generated request id, unique per user and operation.
      schema: { type: string, minLength: 8, maxLength: 100 }
  responses:
    CheckoutResultRedirect:
      description: Redirect to the result page; the query carries only durum=basarili or durum=basarisiz.
      headers:
        Location:
          description: /odeme/donus?durum=basarili|basarisiz on the web origin.
          schema: { type: string }
    Generic:
      description: OK.
      content:
        application/json:
          schema: { type: object }
    Created:
      description: Created.
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id: { type: string, format: uuid }
    Accepted:
      description: Accepted for processing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobRef' }
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentRequired:
      description: Insufficient credits or daily free quota exhausted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict or duplicate.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Upload larger than 20 MB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: 'User facing message; never includes internals.' }
        requestId: { type: string }
    ErrorCode:
      type: string
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - payload_too_large
        - rate_limited
        - insufficient_credits
        - nonce_expired
        - unavailable
        - internal
    Health:
      type: object
      description: Only the overall state is exposed; variable and dependency names stay internal.
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded] }
    Version:
      type: object
      required: [version, commit, builtAt]
      properties:
        version: { type: string }
        commit: { type: string }
        builtAt: { type: string, format: date-time }
    JobRef:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }
    JobStatus:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/JobType' }
        status: { $ref: '#/components/schemas/JobState' }
        result: { type: [object, 'null'] }
        error: { type: [string, 'null'] }
    JobState:
      type: string
      enum: [queued, running, done, failed, dead]
    JobType:
      type: string
      enum:
        - ingest.fetch
        - ingest.parse
        - anon.run
        - embed.chunks
        - citations.extract
        - rules.extract
        - docx.validate
        - kampus.summarize
        - kampus.poster
        - billing.monthly_grant
        - billing.reconcile
        - notify.send
        - kalemcik.daily
        - mevzuat.rg_daily
        - live.fetch
        - account.purge
    Me:
      type: object
      required: [id, email, roles, eduVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string }
        eduVerified: { type: boolean }
        targetProfession: { type: [string, 'null'] }
        avatar: { type: [string, 'null'] }
        tone: { type: [string, 'null'], enum: [nazik, dogrudan, null] }
        plan: { type: string, enum: [ucretsiz, byok, ogrenci_plus, akademisyen] }
    OrderLegalDocument:
      type: object
      additionalProperties: false
      required: [slug, version, text, sha256]
      properties:
        slug: { type: string, enum: [on-bilgilendirme, mesafeli-satis, abonelik] }
        version: { type: string, minLength: 1 }
        text: { type: string, minLength: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    MeDeleteInput:
      type: object
      additionalProperties: false
      properties:
        requestRefund: { type: boolean, default: true }
    MePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        avatar: { type: string, maxLength: 60 }
        tone: { type: string, enum: [nazik, dogrudan] }
    Consent:
      type: object
      required: [kind, version, granted, at]
      properties:
        kind: { $ref: '#/components/schemas/ConsentKind' }
        version: { type: string }
        granted: { type: boolean }
        at: { type: string, format: date-time }
    ConsentInput:
      type: object
      additionalProperties: false
      required: [kind, version, granted]
      properties:
        kind: { $ref: '#/components/schemas/ConsentKind' }
        version: { type: string, maxLength: 40 }
        granted: { type: boolean }
    ConsentKind:
      type: string
      enum:
        - aydinlatma
        - acik_riza_analitik
        - acik_riza_pazarlama
        - kullanim_kosullari
        - on_bilgilendirme
        - mesafeli_sozlesme
        - cayma_istisnasi
        - yz_aktarim
        - abonelik_sozlesmesi
        - yillik_taahhutname
        - yz_ucretsiz_katman
    Profession:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        avatars:
          type: array
          items: { type: string }
    AuthorityClass:
      type: string
      description: plan.md Ek F
      enum: [baglayici_norm, baglayici_karar, yuksek_emsal, emsal, emsal_sinirli, idari_karar, doktrin, karsilastirmali]
    RecordType:
      type: string
      enum: [mevzuat, karar, kurul_karari, makale, kitap, tez, ab_hukuku]
    RecordStatus:
      type: string
      enum: [yururlukte, degisti, yururlukten_kalkti, bozuldu, onandi, kesinlesti, bilinmiyor]
    NormRef:
      type: object
      required: [kanunNo, madde]
      properties:
        kanunNo: { type: string }
        kanunAdi: { type: [string, 'null'] }
        madde: { type: string }
        fikra: { type: [string, 'null'] }
        bent: { type: [string, 'null'] }
        recordId: { type: [string, 'null'], format: uuid }
    Label:
      type: string
      enum: [yeni, yerlesik, eski, oncu, anonimlestirildi, ilgililik_yuksek, ilgililik_orta, ilgililik_arka_plan, guncellik_uyarisi, canli_kaynak, veri_gunu]
    RecordSummary:
      type: object
      required: [id, type, title, authorityClass, status, labels]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/RecordType' }
        title: { type: string }
        court: { type: [string, 'null'] }
        chamber: { type: [string, 'null'] }
        esasNo: { type: [string, 'null'] }
        kararNo: { type: [string, 'null'] }
        date: { type: [string, 'null'], format: date }
        authorityClass: { $ref: '#/components/schemas/AuthorityClass' }
        status: { $ref: '#/components/schemas/RecordStatus' }
        labels:
          type: array
          items: { $ref: '#/components/schemas/Label' }
        snippet: { type: [string, 'null'] }
        liveOnly: { type: boolean }
        fetchedAt: { type: [string, 'null'], format: date-time }
    Record:
      allOf:
        - $ref: '#/components/schemas/RecordSummary'
        - type: object
          required: [jurisdiction, anonymized, sourceUrl]
          properties:
            jurisdiction: { type: string }
            normRefs:
              type: array
              items: { $ref: '#/components/schemas/NormRef' }
            validFrom: { type: [string, 'null'], format: date }
            validTo: { type: [string, 'null'], format: date }
            amendedBy: { type: [string, 'null'] }
            licenseBasis: { type: string }
            anonymized: { type: boolean }
            anonymizationVersion: { type: [string, 'null'] }
            sourceUrl: { type: string, format: uri }
            text: { type: string }
    RecordVersion:
      type: object
      required: [id, validFrom]
      properties:
        id: { type: string, format: uuid }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        amendedBy: { type: [string, 'null'] }
        text: { type: string }
    SearchResponse:
      type: object
      required: [items, page, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RecordSummary' }
        live:
          type: array
          items: { $ref: '#/components/schemas/RecordSummary' }
        resolvedNorms:
          type: array
          items: { $ref: '#/components/schemas/NormRef' }
        page: { type: integer }
        total: { type: integer }
    CitationGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/RecordSummary' }
        edges:
          type: array
          items:
            type: object
            required: [from, to, kind]
            properties:
              from: { type: string, format: uuid }
              to: { type: string, format: uuid }
              kind: { type: string, enum: [atif, bozma, onama, ayni_yonde, aksi_yonde] }
    SourceChip:
      type: object
      description: A source shown next to a sentence (kenar serhi).
      required: [id, recordId, title, authorityClass, status]
      properties:
        id: { type: string, description: 'Prompt local id such as K3.' }
        recordId: { type: string, format: uuid }
        title: { type: string }
        authorityClass: { $ref: '#/components/schemas/AuthorityClass' }
        status: { $ref: '#/components/schemas/RecordStatus' }
        date: { type: [string, 'null'], format: date }
        fetchedAt: { type: [string, 'null'], format: date-time }
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [q]
      properties:
        q: { type: string, minLength: 3, maxLength: 1000 }
        mode: { type: string, enum: [platform, byok_aktarma], default: platform }
        depth: { type: string, enum: [standart, derin], default: standart }
        filters:
          type: object
          additionalProperties: false
          properties:
            type: { $ref: '#/components/schemas/RecordType' }
            from: { type: string, format: date }
            to: { type: string, format: date }
            court: { type: string }
        byok:
          description: Only for byok_aktarma; key is held in request memory, never stored or logged.
          type: object
          additionalProperties: false
          required: [provider, model, apiKey]
          properties:
            provider: { $ref: '#/components/schemas/ByokProvider' }
            model: { type: string, maxLength: 120 }
            apiKey: { type: string, maxLength: 400, writeOnly: true }
    ByokProvider:
      type: string
      enum: [anthropic, openrouter, openai, gemini]
    AnswerEvent:
      description: SSE data payload; the SSE event name equals the `t` discriminator.
      oneOf:
        - $ref: '#/components/schemas/CumleEvent'
        - $ref: '#/components/schemas/KaynaklarEvent'
        - $ref: '#/components/schemas/UyariEvent'
        - $ref: '#/components/schemas/CekimserEvent'
        - $ref: '#/components/schemas/SonEvent'
      discriminator:
        propertyName: t
        mapping:
          cumle: '#/components/schemas/CumleEvent'
          kaynaklar: '#/components/schemas/KaynaklarEvent'
          uyari: '#/components/schemas/UyariEvent'
          cekimser: '#/components/schemas/CekimserEvent'
          son: '#/components/schemas/SonEvent'
    CumleEvent:
      type: object
      required: [t, index, metin, kaynaklar, alinti]
      properties:
        t: { type: string, const: cumle }
        index: { type: integer, minimum: 0, maximum: 2 }
        metin: { type: string }
        kaynaklar:
          type: array
          minItems: 1
          items: { type: string }
        alinti:
          type: object
          additionalProperties: { type: string, minLength: 12 }
        destekleyici: { type: boolean, description: 'True when no binding source supports the sentence.' }
    KaynaklarEvent:
      type: object
      required: [t, kaynaklar]
      properties:
        t: { type: string, const: kaynaklar }
        kaynaklar:
          type: array
          items: { $ref: '#/components/schemas/SourceChip' }
    UyariEvent:
      type: object
      required: [t, kod, metin]
      properties:
        t: { type: string, const: uyari }
        kod: { type: string, enum: [veri_gunu, guncellik, destekleyici_kaynak, sabit_fr19, sabit_fr20] }
        metin: { type: string }
        cumleIndex: { type: [integer, 'null'] }
    CekimserEvent:
      type: object
      required: [t, metin]
      properties:
        t: { type: string, const: cekimser }
        metin: { type: string }
        neden: { type: [string, 'null'] }
    SonEvent:
      type: object
      required: [t, requestId, creditsCharged]
      properties:
        t: { type: string, const: son }
        requestId: { type: string }
        creditsCharged: { type: integer, minimum: 0 }
        droppedLines: { type: integer, minimum: 0 }
    PrepareRequest:
      type: object
      additionalProperties: false
      required: [q, provider, model]
      properties:
        q: { type: string, minLength: 3, maxLength: 1000 }
        provider: { $ref: '#/components/schemas/ByokProvider' }
        model: { type: string, maxLength: 120 }
        depth: { type: string, enum: [standart, derin], default: standart }
    PrepareResponse:
      type: object
      required: [nonce, expiresAt, signature, system, prompt, sources, limits]
      properties:
        nonce:
          type: string
          minLength: 16
          description: 'Single use. Stored in Valkey with SET NX EX 600 at prepare and consumed atomically (GETDEL) at verify; a reused or expired nonce returns 410.'
        expiresAt: { type: string, format: date-time, description: 'Issued time plus 10 minutes.' }
        signature: { type: string, description: 'Server HMAC over nonce, expiresAt, prompt hash and source ids.' }
        system: { type: string, description: 'Fixed system instruction (Ek D.1).' }
        prompt: { type: string, description: 'Masked query and wrapped passages.' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceChip' }
        passages:
          type: object
          description: Passage text per prompt id, for client side validation.
          additionalProperties: { type: string }
        limits:
          type: object
          required: [maxInputTokens, maxOutputTokens]
          properties:
            maxInputTokens: { type: integer }
            maxOutputTokens: { type: integer }
    VerifyRequest:
      type: object
      additionalProperties: false
      required: [nonce, signature, lines]
      properties:
        nonce: { type: string }
        signature: { type: string }
        lines:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 4000, description: 'Raw JSON Lines produced by the model.' }
        save: { type: boolean, default: false }
    VerifyResponse:
      type: object
      required: [results, abstained]
      properties:
        results:
          type: array
          items:
            type: object
            required: [index, ok]
            properties:
              index: { type: integer }
              ok: { type: boolean }
              reason: { type: [string, 'null'] }
        abstained: { type: boolean }
        savedId: { type: [string, 'null'], format: uuid }
    LibraryItem:
      type: object
      required: [id, recordId, createdAt]
      properties:
        id: { type: string, format: uuid }
        recordId: { type: string, format: uuid }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    GuideProgress:
      type: object
      additionalProperties: false
      required: [completedSteps]
      properties:
        completedSteps:
          type: array
          items: { type: string }
        updatedAt: { type: string, format: date-time, readOnly: true }
    Journal:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        issn: { type: [string, 'null'] }
        hasApprovedRules: { type: boolean }
    RuleSet:
      type: object
      required: [id, version, rules]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        approvedAt: { type: [string, 'null'], format: date-time }
        rules:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string }
              value: {}
              evidence: { type: [string, 'null'], description: 'Source excerpt from the guide.' }
    TemplateRuleRecord:
      type: object
      description: An extracted rule set as the control screen holds it (yazma kural-semasi KuralKaydi).
      required: [id, model, institutionName, tur, degerler, kaynaklar, kanitlar]
      properties:
        id: { type: string, format: uuid }
        model: { type: [string, 'null'], description: 'Model tier that extracted the rules.' }
        institutionName: { type: [string, 'null'], maxLength: 200 }
        tur: { type: string, enum: [tez, makale] }
        degerler:
          type: object
          description: Rule values keyed by rule key (paper, margins, fonts, spacing, limits and so on).
          additionalProperties: true
        kaynaklar:
          type: object
          description: Where each value came from, keyed by rule key.
          additionalProperties: { type: string, enum: [kilavuz, ornek, duzenlendi] }
        kanitlar:
          type: object
          description: Verbatim guide excerpt and page for values taken from the guide, keyed by rule key.
          additionalProperties:
            type: object
            required: [sayfa, alinti]
            properties:
              sayfa: { type: [integer, 'null'] }
              alinti: { type: string }
    DocxCheckFinding:
      type: object
      required: [key, status, expected]
      properties:
        key: { type: string, description: 'Rule key, for example margins or wordLimit.' }
        status: { type: string, enum: [uygun, uyumsuz, yok, elle] }
        expected: { description: 'Value required by the rule set.' }
        found: { description: 'Value measured in the document, when there is one.' }
        share: { type: number, minimum: 0, maximum: 1, description: 'Share of the text that complies.' }
        detail: { type: string }
    DocxCheckResult:
      type: object
      required: [kind, sections, summary, findings]
      properties:
        kind: { type: string, enum: [tez, makale] }
        sections: { type: integer, minimum: 0 }
        summary:
          type: object
          required: [uygun, uyumsuz, yok, elle]
          properties:
            uygun: { type: integer, minimum: 0 }
            uyumsuz: { type: integer, minimum: 0 }
            yok: { type: integer, minimum: 0 }
            elle: { type: integer, minimum: 0 }
        findings:
          type: array
          items: { $ref: '#/components/schemas/DocxCheckFinding' }
    WritingSettings:
      type: object
      additionalProperties: false
      required: [hitap]
      properties:
