      type: object
      additionalProperties: false
      description: >-
        Body of createWritingProject (v1.5.1). title, kind and targetWords are required; the server trims title and
        rejects a blank one.
      required: [title, kind, targetWords]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        kind: { type: string, enum: [tez, makale, odev] }
        targetWords: { type: integer, minimum: 0, maximum: 2000000 }
        deadline: { type: string, format: date }
    WritingProjectInput:
      type: object
      additionalProperties: false
      description: >-
        Body of updateWritingProject: a partial update, every field optional and only the given fields change.
        Same rules as WritingProjectCreateInput; deadline cannot be cleared (null is rejected).
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        kind: { type: string, enum: [tez, makale, odev] }
        targetWords: { type: integer, minimum: 0, maximum: 2000000 }
        deadline: { type: string, format: date }
    Deck:
