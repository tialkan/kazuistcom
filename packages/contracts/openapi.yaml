        KVKK m.11/1 (a) to (g with breve) in order. itiraz is m.11/1-g (objection to a result of an
        exclusively automated analysis).
      enum:
        - islenip_islenmedigi
        - bilgi
        - amac
        - aktarim_bilgisi
        - duzeltme
        - silme
        - ucuncu_kisilere_bildirim
        - itiraz
        - zarar_giderimi
