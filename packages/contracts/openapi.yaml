      type: object
      additionalProperties: false
      required: [kind, detail]
      properties:
        kind: { $ref: '#/components/schemas/KvkkRequestKind' }
        detail: { type: string, maxLength: 4000 }
        replyChannel:
          allOf: [{ $ref: '#/components/schemas/KvkkReplyChannel' }]
          default: eposta
        address: { type: string, maxLength: 500, description: Required when replyChannel is posta. }
    KvkkGuestRequestInput:
      type: object
      additionalProperties: false
      description: Teblig m.5 (RG 10.03.2018, 30356) contents of an application.
      required:
        [kind, detail, requesterName, nationality, identityNumber, address, contactEmail, relation, replyChannel, declaration]
      properties:
        kind: { $ref: '#/components/schemas/KvkkRequestKind' }
        detail: { type: string, minLength: 1, maxLength: 4000 }
        requesterName: { type: string, minLength: 2, maxLength: 200 }
        nationality: { type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2. }
        identityNumber:
          type: string
          minLength: 5
          maxLength: 40
          description: T.C. kimlik numarasi when nationality is TR, otherwise passport or identity number. Stored encrypted.
        address: { type: string, minLength: 10, maxLength: 500 }
        contactEmail: { type: string, format: email }
        phone: { type: string, maxLength: 40 }
        relation: { $ref: '#/components/schemas/KvkkRelation' }
        replyChannel: { $ref: '#/components/schemas/KvkkReplyChannel' }
        declaration: { type: boolean, const: true }
