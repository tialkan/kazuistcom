openapi: 3.1.0
info:
  title: Kazuist API
  version: 1.5.1
  summary: Kazuist web and iOS API contract (single source of truth).
  description: |
    Contract v1.5.1 for Kazuist (plan.md Ek C.1; changes in docs/adr/0023-sozlesme-v1-1.md,
    docs/adr/0026-sozlesme-v1-2.md, docs/adr/0027-kalici-siparis-belgeleri-ve-urun-surumleri.md,
    docs/adr/0028-hesap-silme-iade-yonetimi.md and docs/adr/0035-sozlesme-v1-5.md). All endpoints
    validate input with zod and reject unknown fields. Every error body is `{code, message, requestId}` and
    never exposes internal structure. Paths are relative to the `/api` prefix of the web application.

    Implementation state (v1.5): every path either has a Route Handler under apps/web/src/app/api or carries
    `x-kazuist-uygulama`: `planlandi` (a 1.0 feature whose handler is not written yet) or `kaldirilacak`
    (removed in the next breaking contract, ADR-0036). packages/contracts/test/rotalar.test.ts enforces this.
  license:
    name: Proprietary, Kulular Bilisim Teknolojileri Ltd. Sti.
    identifier: LicenseRef-Proprietary
  contact:
    name: Kulular Bilisim Teknolojileri Ltd. Sti.
    url: https://kazuist.com
servers:
  - url: https://kazuist.com/api
    description: Production
  - url: https://staging.kazuist.com/api
    description: Staging
security:
  - sessionCookie: []
  - bearerAuth: []
tags:
  - name: system
    description: Health and version probes.
  - name: auth
    description: Better Auth handler (sign in, sign up, passkey, OAuth). Owned by the kimlik agent.
  - name: account
    description: Current user, consents, KVKK rights.
  - name: search
    description: Hybrid search, records and norm resolution.
  - name: answers
    description: Sourced summary (kaynakli ozet) streaming and BYOK client protocol.
  - name: citations
    description: Citation network.
  - name: library
    description: Saved records and bibliography export.
  - name: guides
    description: Guide progress.
  - name: writing
    description: Templates, journals, writing projects and abbreviations.
  - name: practice
    description: Decks, FSRS reviews and HMGS exams.
  - name: kampus
    description: Turkuaz Kampus (separate schema, feature flagged).
  - name: wallet
    description: Credit wallet, ledger view and prices.
  - name: billing
    description: Checkout, subscriptions, refunds and invoices.
  - name: webhooks
    description: Payment provider callbacks (signature verified, idempotent).
  - name: notifications
    description: Notification preferences and push registration.
  - name: takedown
    description: Content removal requests.
  - name: jobs
    description: Background job status.
  - name: admin
    description: Administration (passkey and second factor required).
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: All critical dependencies configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A critical dependency is unreachable or not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Build version
      security: []
      responses:
        '200':
          description: Version info.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: Better Auth sub path (for example sign-in/email). The handler owns the shape.
        schema: { type: string }
    get:
      tags: [auth]
      operationId: authGet
      summary: Better Auth GET handler
      security: []
      responses:
        '200': { $ref: '#/components/responses/Generic' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [auth]
      operationId: authPost
      summary: Better Auth POST handler
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Generic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/step-up/confirm:
    post:
      tags: [auth]
      operationId: confirmStepUp
      summary: Confirm the second factor of a staff session
      description: |
        Editors and administrators confirm the TOTP code once per passkey session before any /v1/admin call
        (plan 5.6/2). Requires a passkey session and an enabled TOTP; the code is never logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpConfirmInput' }
      responses:
        '204':
          description: Second step confirmed for this session.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: Current user
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [account]
      operationId: updateMe
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MePatch' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [account]
      operationId: deleteMe
      summary: Delete account (KVKK m.7)
      description: An absent body or absent requestRefund preserves the default refund request choice (true).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeDeleteInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/orders/{orderId}/legal-documents:
    get:
      tags: [account]
      operationId: listMyOrderLegalDocuments
      summary: Read the authenticated user's frozen order documents
      description: |
        Own orders only; unavailable snapshots are never recreated from current texts.
        Responses contain personal data and require Cache-Control private, no-store.
        Neither documents nor buyer fields are logged or sent to external push services.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The complete frozen document set for this order.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                additionalProperties: false
                properties:
                  documents:
                    type: array
                    minItems: 2
                    maxItems: 3
                    items: { $ref: '#/components/schemas/OrderLegalDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/me/edu-verification:
    post:
      tags: [account]
      operationId: startEduVerification
      summary: Send code to an edu.tr address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204':
          description: Code sent (synchronously; there is no job to poll).
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/me/edu-verification/confirm:
    post:
      tags: [account]
      operationId: confirmEduVerification
      summary: Confirm edu.tr code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/export:
    get:
      tags: [account]
      operationId: exportMe
      summary: Export personal data (KVKK m.11, FR-104)
      description: Synchronous download as an attachment (Content-Disposition). Secrets and hashes are never included.
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: Export file.
          headers:
            Content-Disposition:
              description: attachment; filename="kazuist-verilerim-<YYYY-MM-DD>.<json|csv>"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeExport' }
            text/csv:
              schema:
                type: string
                description: Long format with the header section,row,field,value; formula prefixes are neutralised.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/me/consents:
    get:
      tags: [account]
      operationId: listConsents
      summary: List consents
      responses:
        '200':
          description: Consents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [account]
      operationId: recordConsent
      summary: Record or withdraw a consent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentInput' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/target-profession:
    put:
      tags: [account]
      operationId: setTargetProfession
      summary: Set target profession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [professionId]
              properties:
                professionId: { type: string }
                avatar: { type: string }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/professions:
    get:
      tags: [account]
      operationId: listProfessions
      summary: List professions
      security: []
      responses:
        '200':
          description: Professions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Profession' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/kvkk-requests:
    post:
      tags: [account]
      operationId: createKvkkRequest
      summary: KVKK m.11 application (signed in)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KvkkRequestInput' }
      responses:
        '201':
          description: Application recorded; the thirty day period (KVKK m.13/2) runs from receivedAt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KvkkRequestReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/kvkk-requests/guest:
    post:
      tags: [account]
      operationId: createGuestKvkkRequest
      summary: KVKK m.11 application without an account
      description: |
        For people without an account (for example a person named in a decision). Rate limited by IP; a six
        digit code is sent to contactEmail and the application is confirmed with
        /v1/kvkk-requests/guest/verify. receivedAt is the arrival time (Teblig m.5), not the confirmation time.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KvkkGuestRequestInput' }
      responses:
        '202':
          description: Recorded, waiting for e-mail confirmation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KvkkRequestReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/kvkk-requests/guest/verify:
    post:
      tags: [account]
      operationId: verifyGuestKvkkRequest
      summary: Confirm a guest KVKK application with the e-mailed code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, code]
              properties:
                id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KvkkRequestReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/search:
    get:
      tags: [search]
      operationId: search
      summary: Hybrid search
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/RecordType' } }
        - { name: sort, in: query, schema: { type: string, enum: [ilgililik, onem, tarih_yeni, tarih_eski], default: ilgililik } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 1 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: court, in: query, schema: { type: string, maxLength: 100 } }
        - { name: authority, in: query, schema: { $ref: '#/components/schemas/AuthorityClass' } }
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/records/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [search]
      operationId: getRecord
      summary: Record detail
      security: []
      responses:
        '200':
          description: Record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/records/{id}/network:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [citations]
      operationId: getRecordNetwork
      summary: Citation neighbourhood of a record
      security: []
      responses:
        '200':
          description: Graph.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CitationGraph' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/records/{id}/versions:
    x-kazuist-uygulama: planlandi
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [search]
      operationId: getRecordVersions
      summary: Legislation article versions
      security: []
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecordVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/norms/resolve:
    get:
      tags: [search]
      operationId: resolveNorm
      summary: Resolve a norm reference such as "KVKK m.11/1-c"
      security: []
      parameters:
        - { name: ref, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: Resolved references.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NormRef' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/answers:
    post:
      tags: [answers]
      operationId: createAnswer
      summary: Sourced summary stream (platform or BYOK relay mode)
      description: |
        Server Sent Events. Event names are `cumle`, `kaynaklar`, `uyari`, `cekimser`, `son`.
        Each event `data` is a JSON object matching the schema of the same name. Only validated
        sentences are emitted. Abstention costs no credit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerRequest' }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AnswerEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/answers/prepare:
    post:
      tags: [answers]
      operationId: prepareAnswer
      summary: BYOK client mode, signed prompt package
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareRequest' }
      responses:
        '200':
          description: Signed prompt package valid for 10 minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrepareResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/answers/verify:
    post:
      tags: [answers]
      operationId: verifyAnswer
      summary: BYOK, server side line validation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: Validation result per line.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410':
          description: Nonce expired or already used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/citation-network:
    get:
      tags: [citations]
      operationId: getCitationNetwork
      summary: Citation network filtered view
      security: []
      parameters:
        - { name: court, in: query, schema: { type: string } }
        - { name: chamber, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Graph.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CitationGraph' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/library:
    get:
      tags: [library]
      operationId: listLibrary
      summary: Saved items
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LibraryItem' }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [library]
      operationId: addLibraryItem
      summary: Save a record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recordId]
              properties:
                recordId: { type: string, format: uuid }
                note: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/library/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [library]
      operationId: deleteLibraryItem
      summary: Remove a saved item
      responses:
        '204': { description: 'Removed.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/library/export:
    get:
      tags: [library]
      operationId: exportLibrary
      summary: Bibliography export (CSL)
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [isnad-dipnotlu, isnad-metinici, oscola, bluebook, ris, bibtex] }
      responses:
        '200':
          description: Export file.
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/guides/{id}/progress:
    x-kazuist-uygulama: planlandi
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [guides]
      operationId: getGuideProgress
      summary: Guide progress
      responses:
        '200':
          description: Progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuideProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [guides]
      operationId: setGuideProgress
      summary: Update guide progress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuideProgress' }
      responses:
        '200':
          description: Progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuideProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/templates/rules:
    post:
      tags: [writing]
      operationId: extractTemplateRules
      summary: Upload a thesis guide and start rule extraction (returns a job)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/pdf }
                institutionName: { type: string, maxLength: 200 }
                kind: { type: string, enum: [tez, makale], default: tez }
      responses:
        '202':
          description: Job created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/templates/rules/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
