  /v1/templates/check:
    post:
      tags: [writing]
      operationId: checkTemplateDocx
      summary: Check a DOCX against a rule set (file is not stored)
      description: |
        The file goes to the internal DOCX checker of worker-py in memory only; it is never stored, logged or
        sent to an AI provider. `rules` is a JSON string `{tur, degerler}` validated by the writing module.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, rules]
              properties:
                file:
                  type: string
                  contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
                rules: { type: string, contentMediaType: application/json }
      responses:
        '200':
          description: Findings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocxCheckResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: The DOCX checker is not configured or not reachable (fail closed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
