<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Kazuist bakımda</title>
    <style>
      :root {
        --bg: #f7f5f0;
        --fg: #1d1b16;
        --muted: #5b574d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15140f;
          --fg: #f1eee6;
          --muted: #b3ad9f;
        }
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          17px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 18vh auto 0;
        padding: 0 16px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kazuist kısa bir bakımda</h1>
      <p>Yeni sürümü yüklüyoruz. Sayfa birkaç dakika içinde yeniden açılacak.</p>
      <p lang="en">Kazuist is being updated and will be back in a few minutes.</p>
    </main>
  </body>
</html>
