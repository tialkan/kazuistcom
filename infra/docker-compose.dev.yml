# Local development services. All ports bind to 127.0.0.1 only.
# Usage: docker compose -f infra/docker-compose.dev.yml --env-file .env up -d
name: kazuist-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: kazuist
      POSTGRES_USER: kazuist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kazuist -d kazuist']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0.6-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible local object store. MinIO stopped publishing images (Docker Hub removed, quay.io
    # requires authentication since 2026); SeaweedFS (Apache-2.0) replaces it. See docs/istekler/altyapi-s3-yerel.md.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ['server', '-dir=/data', '-s3', '-s3.port=9000', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - s3data:/data

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  pgdata:
  valkeydata:
  s3data:
