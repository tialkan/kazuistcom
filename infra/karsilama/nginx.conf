server {
  listen 3000;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.(webp|woff2|png|svg|ico)$ {
    add_header Cache-Control "public, max-age=604800";
  }
  location = /lansman { try_files /lansman.html =404; }
  location / { try_files $uri $uri.html $uri/ /index.html; }
}
